<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#09122c"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Cyan to Teal Orbit Gradient -->
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Nucleus Glow Radial Gradient -->
    <radialGradient id="nucleusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Electron Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Orbital Ring 1: 0 deg tilt -->
  <ellipse cx="256" cy="256" rx="190" ry="74" fill="none" stroke="url(#cyanTeal)" stroke-width="7" opacity="0.85" filter="url(#glow)"/>

  <!-- Orbital Ring 2: 60 deg tilt -->
  <g transform="rotate(60 256 256)">
    <ellipse cx="256" cy="256" rx="190" ry="74" fill="none" stroke="url(#cyanTeal)" stroke-width="7" opacity="0.85" filter="url(#glow)"/>
    <!-- Electron 2 -->
    <circle cx="446" cy="256" r="13" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="446" cy="256" r="6" fill="#ffffff"/>
  </g>

  <!-- Orbital Ring 3: 120 deg tilt -->
  <g transform="rotate(120 256 256)">
    <ellipse cx="256" cy="256" rx="190" ry="74" fill="none" stroke="url(#cyanTeal)" stroke-width="7" opacity="0.85" filter="url(#glow)"/>
    <!-- Electron 3 -->
    <circle cx="66" cy="256" r="13" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="66" cy="256" r="6" fill="#ffffff"/>
  </g>

  <!-- Electron 1 on Orbit 1 -->
  <circle cx="446" cy="256" r="13" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="446" cy="256" r="6" fill="#ffffff"/>

  <!-- Central Nucleus Outer Glow -->
  <circle cx="256" cy="256" r="62" fill="url(#nucleusGlow)"/>

  <!-- Central Protons & Neutrons Cluster -->
  <circle cx="244" cy="246" r="22" fill="#06b6d4" opacity="0.95"/>
  <circle cx="268" cy="244" r="20" fill="#38bdf8" opacity="0.95"/>
  <circle cx="248" cy="268" r="20" fill="#2dd4bf" opacity="0.95"/>
  <circle cx="268" cy="266" r="19" fill="#818cf8" opacity="0.9"/>
  <circle cx="256" cy="256" r="15" fill="#f8fafc" opacity="0.95"/>

  <!-- "ATOM 3D" Text Branding at Bottom -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    ATOM <tspan fill="#38bdf8">3D</tspan>
  </text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    PERIODIC TABLE
  </text>
</svg>
